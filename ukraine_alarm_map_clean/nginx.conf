events {
    worker_connections 128;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=60s;
    resolver_timeout 5s;

    map $scheme $ws_scheme {
        http  ws;
        https wss;
    }

    server {
        listen 8765;
        server_name _;

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 172.30.32.0/23;
        allow 192.168.0.0/16;
        deny all;

        location = /connection/websocket {
            set $ws_upstream ws.ukrainealarm.com;
            proxy_pass https://$ws_upstream/connection/websocket;
            proxy_ssl_server_name on;
            proxy_ssl_name ws.ukrainealarm.com;
            proxy_set_header Host ws.ukrainealarm.com;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin https://map.ukrainealarm.com;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;
            proxy_hide_header X-Frame-Options;
        }

        location ~* \.js$ {
            set $map_upstream map.ukrainealarm.com;
            proxy_pass https://$map_upstream;
            proxy_ssl_server_name on;
            proxy_ssl_name map.ukrainealarm.com;
            proxy_set_header Host map.ukrainealarm.com;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect https://map.ukrainealarm.com/ $http_x_ingress_path/;
            proxy_redirect http://map.ukrainealarm.com/ $http_x_ingress_path/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;
            proxy_hide_header X-Frame-Options;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

            sub_filter_types application/javascript application/x-javascript text/javascript;
            sub_filter_once off;
            sub_filter '"/api/' '"$http_x_ingress_path/api/';
            sub_filter "'/api/" "'$http_x_ingress_path/api/";
            sub_filter '`/api/' '`$http_x_ingress_path/api/';
            sub_filter '"/images/' '"$http_x_ingress_path/images/';
            sub_filter "'/images/" "'$http_x_ingress_path/images/";
            sub_filter '`/images/' '`$http_x_ingress_path/images/';
            sub_filter '"/main-map/' '"$http_x_ingress_path/main-map/';
            sub_filter "'/main-map/" "'$http_x_ingress_path/main-map/";
            sub_filter '`/main-map/' '`$http_x_ingress_path/main-map/';
            sub_filter '"/data/' '"$http_x_ingress_path/data/';
            sub_filter "'/data/" "'$http_x_ingress_path/data/";
            sub_filter '`/data/' '`$http_x_ingress_path/data/';
            sub_filter '"/ukraine.json' '"$http_x_ingress_path/ukraine.json';
            sub_filter "'/ukraine.json" "'$http_x_ingress_path/ukraine.json";
            sub_filter '`/ukraine.json' '`$http_x_ingress_path/ukraine.json';
            sub_filter '"/onlinecount' '"$http_x_ingress_path/onlinecount';
            sub_filter "'/onlinecount" "'$http_x_ingress_path/onlinecount";
            sub_filter '`/onlinecount' '`$http_x_ingress_path/onlinecount';
            sub_filter '"/sounds/' '"$http_x_ingress_path/sounds/';
            sub_filter "'/sounds/" "'$http_x_ingress_path/sounds/";
            sub_filter '`/sounds/' '`$http_x_ingress_path/sounds/';
            sub_filter '"/heat/' '"$http_x_ingress_path/heat/';
            sub_filter "'/heat/" "'$http_x_ingress_path/heat/";
            sub_filter '`/heat/' '`$http_x_ingress_path/heat/';
        }

        location / {
            set $map_upstream map.ukrainealarm.com;
            proxy_pass https://$map_upstream;
            proxy_ssl_server_name on;
            proxy_ssl_name map.ukrainealarm.com;
            proxy_set_header Host map.ukrainealarm.com;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect https://map.ukrainealarm.com/ $http_x_ingress_path/;
            proxy_redirect http://map.ukrainealarm.com/ $http_x_ingress_path/;

            proxy_set_header Cache-Control "no-cache, no-store, max-age=0";
            proxy_set_header Pragma "no-cache";
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;
            proxy_hide_header X-Frame-Options;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires -1;
            proxy_cache_bypass 1;
            proxy_no_cache 1;

            sub_filter_once off;
            sub_filter 'href="/' 'href="$http_x_ingress_path/';
            sub_filter "href='/'" "href='$http_x_ingress_path/";
            sub_filter 'src="/' 'src="$http_x_ingress_path/';
            sub_filter "src='/'" "src='$http_x_ingress_path/";

            sub_filter '<input id="centrifugo-url" type="hidden" value="wss://ws.ukrainealarm.com/connection/websocket"/>' '<input id="centrifugo-url" type="hidden" value="__HA_INGRESS_WS__"/><script>(function(){var p="$http_x_ingress_path";if(!p){p=location.pathname;}if(p.charAt(p.length-1)!="/"){p+="/";}var s=location.protocol==="https:"?"wss:":"ws:";document.getElementById("centrifugo-url").value=s+"//"+location.host+p+"connection/websocket";})();</script>';

            sub_filter '</head>' '<script id="ha-clean-init">
(function() {
    var ingress = "$http_x_ingress_path";
    if (!ingress) { ingress = location.pathname; }
    if (ingress.charAt(ingress.length - 1) !== "/") { ingress += "/"; }

    // 1. Auto-accept onboarding modal so it never blocks the map
    try {
        localStorage.setItem("detailMapOnboardingAccepted:v2:main", "true");
        localStorage.setItem("detailMapOnboardingAccepted:v1:main", "true");
    } catch(e) {}

    // 2. Intercept fetch to route any relative path starting with / through HA Ingress
    var origFetch = window.fetch;
    window.fetch = function(resource, init) {
        if (typeof resource === "string") {
            if (resource.charAt(0) === "/" && resource.indexOf(ingress) !== 0) {
                resource = ingress + resource.substring(1);
            }
        } else if (resource && typeof resource.url === "string") {
            if (resource.url.charAt(0) === "/" && resource.url.indexOf(ingress) !== 0) {
                resource = new Request(ingress + resource.url.substring(1), resource);
            }
        }
        return origFetch.call(this, resource, init);
    };

    // 3. Intercept XMLHttpRequest to route any relative URL through Ingress
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        if (typeof url === "string" && url.charAt(0) === "/" && url.indexOf(ingress) !== 0) {
            url = ingress + url.substring(1);
        }
        return origOpen.call(this, method, url, async, user, password);
    };
})();
</script><style id="ha-clean-map">
html,body{width:100%!important;height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;background:transparent!important}
.app{width:100%!important;height:100%!important;min-height:100%!important;margin:0!important;padding:0!important}
.header,.menu,.menu .content,.menu .links,.bottom-banner,.statistics-button,.links,.detailMapOnboarding{display:none!important}
.content{position:relative!important;width:100%!important;height:100%!important;min-height:100%!important;margin:0!important;padding:0!important}
.map{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important}
.appHolder,.svgMapHolder,.svgMapIconsHolder,.detailSatelliteMap{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
.svgMapIcons{width:100%!important;height:100%!important}
.maplibregl-map,.maplibregl-canvas-container,.maplibregl-canvas{width:100%!important;height:100%!important}
.general-button{display:flex!important;z-index:30!important}
.general-aside{z-index:35!important}
.content > .info{position:absolute!important;z-index:20!important;left:20px!important;bottom:20px!important;transform:none!important;width:auto!important;max-width:calc(100% - 40px)!important;height:auto!important;max-height:none!important;box-sizing:border-box!important;margin:0!important;overflow:visible!important}
.info .online{display:none!important}

/* Clean styling for controls toolbar (targets switch, danger zone switch, theme) */
.content > .mainMapControls{z-index:26!important}
.content .toolbar{position:absolute!important;z-index:26!important;right:12px!important;bottom:16px!important;background:rgba(30,34,42,0.88)!important;backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important;border:1px solid rgba(255,255,255,0.12)!important;border-radius:10px!important;padding:10px 14px!important;box-shadow:0 8px 32px rgba(0,0,0,0.37)!important}
.mainMapHelpControls{display:none!important}
.heatMapHelp{display:none!important}
</style></head>';
        }
    }
}
